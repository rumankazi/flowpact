name: Publish
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      channel:
        type: string
        required: true
      notes:
        type: string
        required: false
    secrets:
      token:
        required: true
    outputs:
      url:
        value: ${{ jobs.upload.outputs.url }}

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      url: ${{ steps.up.outputs.url }}
    steps:
      - if: inputs.notes != ''
        run: echo "${{ inputs.notes }}" > NOTES.md
      - id: up
        run: |
          url=$(./upload.sh --channel "${{ inputs.channel }}" --token "${{ secrets.token }}")
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: echo "uploaded to ${{ env.TARGET_URL }}"
