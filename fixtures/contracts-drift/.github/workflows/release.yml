name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      version: ${{ github.ref_name }}
      dry-run: false
    secrets:
      deploy-token: ${{ secrets.DEPLOY_TOKEN }}

  announce:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/notify
        with:
          message: Released ${{ github.ref_name }} to ${{ needs.deploy.outputs.url }}
