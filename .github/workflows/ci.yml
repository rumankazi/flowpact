name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm coverage
      - name: Dogfood — lint this repository's workflows
        run: node packages/cli/dist/index.js lint --fail-on warning --output flowpact-report.json
      - if: always() && matrix.node == '24'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports
          path: |
            flowpact-report.json
            coverage/

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build
      - run: pnpm docs:check

  smoke:
    # The packed CLI, installed the way users install it, on every platform.
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter flowpact build
      - name: Pack the CLI and check the tarball
        shell: bash
        working-directory: packages/cli
        run: |
          node ../../scripts/check-pack.mjs
          tarball=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          # The package has no dependencies, so linking the unpacked tarball gives users' `flowpact` command (the npm shim)
          # without downloading anything. Relative paths keep Windows drive letters away from tar.
          cd "$RUNNER_TEMP"
          mkdir -p flowpact-package
          tar -xzf "$tarball" -C flowpact-package
          cd flowpact-package/package
          npm link --ignore-scripts --no-audit --no-fund
      - run: node scripts/smoke.mjs

  action-dist:
    name: Action bundle is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @flowpact/action build
      - name: Compare with the committed bundle
        run: |
          if [ -n "$(git status --porcelain packages/action/dist)" ]; then
            git status --short packages/action/dist
            echo "::error::packages/action/dist is out of date. Run 'pnpm --filter @flowpact/action build' and commit the result."
            exit 1
          fi

  action-dogfood:
    name: Action on this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: flowpact
        uses: ./
        with:
          mode: lint
          fail-on: warning
          report-sarif: flowpact.sarif
      - name: Upload SARIF to code scanning
        # Pull requests from forks get a read-only token, so only upload for this repository's own refs.
        if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: flowpact.sarif
          category: flowpact

  action-smoke:
    # The committed action bundle against fixtures with known results: outputs, reports and the drift artifact.
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: incident
        name: lint finds the matrix incident
        uses: ./
        with:
          working-directory: fixtures/incident-matrix
          fail-on: never
          annotations: false
          summary: false
          report-json: incident.json
      - id: drift
        name: check reports contract drift
        uses: ./
        with:
          mode: check
          working-directory: fixtures/contracts-drift
          fail-on: never
          annotations: false
          artifact-name: flowpact-contracts-smoke-${{ github.run_attempt }}
          retention-days: 1
      - name: Check the outputs
        env:
          INCIDENT_ERRORS: ${{ steps.incident.outputs.errors }}
          DRIFT: ${{ steps.drift.outputs.drift }}
          PATCH: ${{ steps.drift.outputs.patch }}
          ARTIFACT_ID: ${{ steps.drift.outputs.artifact-id }}
        run: |
          set -x
          test "$INCIDENT_ERRORS" -ge 1
          jq -e '.findings | any(.code == "FP401")' incident.json
          test "$DRIFT" = true
          test -s "$PATCH"
          test -n "$ARTIFACT_ID"

  ci-passed:
    # The only required status check: add new jobs to `needs` instead of changing the branch rules.
    name: CI passed
    if: always()
    needs: [test, docs, smoke, action-dist, action-dogfood, action-smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "::error::a required job did not succeed ($r)"
              exit 1
            fi
          done
